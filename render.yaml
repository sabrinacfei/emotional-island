services:
  - type: web
    name: emotional-island-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NEURAL_MODEL_API_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: emotion_tracker_db
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
