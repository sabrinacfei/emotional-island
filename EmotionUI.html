<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情緒日記</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }
.app { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 1.25rem 1.25rem 4rem; }
.user-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 1.25rem; }
.user-btn { padding: 7px 16px; font-size: 13px; font-weight: 500; border-radius: 20px; border: 1px solid #ddd; cursor: pointer; background: #fff; color: #888; white-space: nowrap; flex-shrink: 0; }
.user-btn.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.tabs { display: flex; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; }
.tab { flex: 1; padding: 10px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; background: transparent; color: #aaa; }
.tab.on { background: #f0f0f0; color: #1a1a1a; }
.pg { display: none; }
.pg.on { display: block; }
.date-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 1rem; }
.nav-btn { background: none; border: 1px solid #e5e5e5; border-radius: 8px; width: 32px; height: 32px; font-size: 18px; cursor: pointer; color: #666; display: flex; align-items: center; justify-content: center; line-height: 1; }
.nav-btn:disabled { color: #ddd; border-color: #f0f0f0; cursor: default; }
.nav-date { font-size: 15px; font-weight: 500; color: #1a1a1a; min-width: 110px; text-align: center; }
.title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.sub { font-size: 13px; color: #666; margin-bottom: 1rem; line-height: 1.5; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
.badge { font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 500; }
.chart-hint { font-size: 12px; color: #ccc; text-align: center; margin: 4px 0 1rem; }
.emo-popup { display: none; border-radius: 12px; border: 1px solid #eee; padding: 1rem 1.1rem; margin-bottom: 1.25rem; border-left-width: 3px; }
.emo-popup-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.emo-popup-title { font-size: 14px; font-weight: 500; }
.emo-popup-body { font-size: 13px; color: #555; line-height: 1.7; }
.slbl { font-size: 12px; color: #aaa; font-weight: 500; margin: 14px 0 6px; }
.trow { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.pill { font-size: 11px; padding: 2px 10px; border-radius: 5px; white-space: nowrap; margin-top: 2px; }
.rsn { font-size: 13px; color: #1a1a1a; line-height: 1.6; }
.leg { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1.25rem; }
.li { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #666; }
.ll { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.hint { font-size: 12px; color: #ccc; text-align: center; margin-bottom: 1rem; }
.card { display: none; background: #f9f9f9; border-radius: 12px; border: 1px solid #eee; padding: 1rem 1.1rem; margin-top: .75rem; }
.ch { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.cd { font-size: 15px; font-weight: 500; }
.cs { font-size: 12px; color: #888; margin-top: 3px; }
.xbtn { background: none; border: none; cursor: pointer; font-size: 16px; color: #ccc; padding: 0; }
.nodata { font-size: 13px; color: #bbb; }
</style>
</head>

<div class="app">

    </div>
    <div id="p1tags"></div>
  </div>

      </div>
      <div class="badges" id="ddom"></div>
      <div id="dtags"></div>
    </div>
  </div>
</div>

// ── 狀態 ──
const UNAMES = Object.keys(DB);
let curUser = UNAMES[0];
let curPage = 1;
let curDayIdx = 6;
let barHitBoxes = [];
let linePoints = [];

// ── 使用者按鈕 ──
const ubar = document.getElementById('ubar');
UNAMES.forEach(n => {
  const b = document.createElement('button');
  b.className = 'user-btn' + (n === curUser ? ' on' : '');
  b.textContent = n;
  b.onclick = () => { curUser = n; curDayIdx = 6; document.querySelectorAll('.user-btn').forEach(x => x.classList.toggle('on', x.textContent === n)); closeAll(); render(); };
  ubar.appendChild(b);
});

// ── 頁面切換 ──
function goPage(n) {
  curPage = n;
  document.getElementById('pg1').classList.toggle('on', n === 1);
  document.getElementById('pg2').classList.toggle('on', n === 2);
  document.getElementById('t1').classList.toggle('on', n === 1);
  document.getElementById('t2').classList.toggle('on', n === 2);

// ── 日期切換 ──
function changeDay(dir) {
  const next = curDayIdx + dir;
  if (next < 0 || next > 6) return;
  curDayIdx = next;
  closeAll();
  render();
}

function closeAll() {
  document.getElementById('ePopup').style.display = 'none';
  document.getElementById('dcard').style.display = 'none';
}

// ── 情緒來源說明 ──
function getEmoSource(day, key) {
  const val = day.e[key];
  if (val === 0) return `今天沒有出現明顯的${EC[key].l}情緒。`;
  const cats = EMO_SRC[key] || ["st"];
  const lines = [];
  cats.forEach(c => {
    const list = c === 'st' ? day.st : c === 'bt' ? day.bt : day.jt;
    if (list) list.filter(t => t.t !== 'none' && t.r).forEach(t => lines.push(t.r));
  });
  if (!lines.length) {
    const all = [...(day.st||[]),...(day.bt||[]),...(day.jt||[])].filter(t=>t.t!=='none'&&t.r).map(t=>t.r);
    return all.length ? all.join('；也因為') + '，共同影響了今天的情緒。' : `今天的${EC[key].l}情緒來自整體日常狀態。`;
  }
  return lines.join('；也因為') + '。';
}

// ── tag HTML ──
function tagBlock(list, bg, tc) {
  if (!list || !list.filter(t=>t.t!=='none').length) return '';
  return list.filter(t=>t.t!=='none').map(t =>
    `<div class="trow"><span class="pill" style="background:${bg};color:${tc};">${TL[t.t]||t.t}</span><span class="rsn">${t.r}</span></div>`
  ).join('');
}
function renderTags(day, el) {
  let h = '';
  const s = tagBlock(day.st,'#D85A3022','#D85A30');
  const b = day.bt&&day.bt.filter(t=>t.t!=='none').length ? tagBlock(day.bt,'#1D9E7522','#1D9E75') : '';
  const j = tagBlock(day.jt,'#7F77DD22','#7F77DD');
  if (s) h += `<p class="slbl">壓力來源</p>${s}`;
  if (b) h += `<p class="slbl">情緒緩衝</p>${b}`;
  if (j) h += `<p class="slbl">快樂來源</p>${j}`;
  el.innerHTML = h || '<p class="nodata">這天沒有記錄標籤資料</p>';
}
function renderDom(day, el) {
  el.innerHTML = day.dom.map(k =>
    `<span class="badge" style="background:${EC[k].c}22;color:${EC[k].c};">${EC[k].l} ${day.e[k]}%</span>`
  ).join('');
}

// ── 柱狀圖 ──
function drawBar(day) {
  const canvas = document.getElementById('barC');
  const W = canvas.parentElement.clientWidth || 420;
  canvas.width = W; canvas.height = 220;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, 220);
  barHitBoxes = [];

  const keys = Object.keys(EC);
  const PL=36, PR=10, PT=20, PB=48;
  const gW = W-PL-PR, gH = 220-PT-PB;
  const bW = Math.floor(gW/keys.length*0.55);
  const gap = gW/keys.length;

  [0,25,50,75,100].forEach(v => {
    const y = PT+gH-(v/100)*gH;
    ctx.strokeStyle='#f0f0f0'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PL,y); ctx.lineTo(W-PR,y); ctx.stroke();
    ctx.fillStyle='#bbb'; ctx.font='11px sans-serif'; ctx.textAlign='right';
    ctx.fillText(v+'%', PL-4, y+4);
  });

  keys.forEach((k,i) => {
    const val = day.e[k];
    const x = PL+i*gap+(gap-bW)/2;
    const bH = (val/100)*gH;
    const y = PT+gH-bH;

    if (bH > 0) {
      const r = 4;
      ctx.fillStyle = EC[k].c+'cc';
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+bW-r,y);
      ctx.quadraticCurveTo(x+bW,y,x+bW,y+r);
      ctx.lineTo(x+bW,y+bH); ctx.lineTo(x,y+bH);
      ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
      ctx.closePath(); ctx.fill();
    }

    if (val > 0) {
      ctx.fillStyle=EC[k].c; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(val+'%', x+bW/2, y-5);
    }
    ctx.fillStyle='#888'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(EC[k].l, x+bW/2, PT+gH+18);

    barHitBoxes.push({x, y:PT, w:bW, h:gH+PB-10, key:k});
  });
}

document.getElementById('barC').addEventListener('click', function(ev) {
  const rect = this.getBoundingClientRect();
  const cx = (ev.clientX-rect.left)*(this.width/rect.width);
  const cy = (ev.clientY-rect.top)*(this.height/rect.height);
  let hit = null;
  barHitBoxes.forEach(b => { if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h) hit=b; });
  if (!hit) return;
  const day = DB[curUser][curDayIdx];
  const emo = EC[hit.key];
  document.getElementById('ePopupTitle').innerHTML = `<span style="color:${emo.c};font-weight:600;">${emo.l} ${day.e[hit.key]}%</span>`;
  document.getElementById('ePopupBody').textContent = getEmoSource(day, hit.key);
  const p = document.getElementById('ePopup');
  p.style.display = 'block';
  p.style.borderLeftColor = emo.c;
  p.style.background = emo.c+'10';
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
});

// ── 綜合情緒分數計算 ──
const POS_EMO = ["Joy","Trust","Anticipation","Surprise"];
const NEG_EMO = ["Sadness","Anger","Fear","Disgust"];
function calcScore(e) {
  const pos = POS_EMO.reduce((s,k)=>s+(e[k]||0),0);
  const neg = NEG_EMO.reduce((s,k)=>s+(e[k]||0),0);
  return Math.max(0, Math.min(100, Math.round(pos*0.6 - neg*0.4 + 50)));
}

// ── 折線圖（單一分數線 + 可拖動輔助線）──
let lineXPositions = [];
let guideX = -1;
let isDragging = false;

function drawLine() {
  const days = DB[curUser];
  const canvas = document.getElementById('lineC');
  const W = canvas.parentElement.clientWidth || 420;
  canvas.width = W; canvas.height = 260;
  const ctx = canvas.getContext('2d');
  const PL=44,PR=16,PT=20,PB=44;
  const gW=W-PL-PR, gH=260-PT-PB;
  lineXPositions = days.map((_,i)=>PL+i*(gW/(days.length-1)));

  if (guideX < 0) guideX = lineXPositions[days.length-1];

  function redraw() {
    ctx.clearRect(0,0,W,260);

    // grid & y labels
    [0,25,50,75,100].forEach(v=>{
      const y=PT+gH-(v/100)*gH;
      ctx.strokeStyle='#f0f0f0'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PL,y); ctx.lineTo(W-PR,y); ctx.stroke();
      ctx.fillStyle='#bbb'; ctx.font='11px sans-serif'; ctx.textAlign='right';
      ctx.fillText(v+'%',PL-5,y+4);
    });

    // x labels
    days.forEach((_,i)=>{
      const x=lineXPositions[i];
      ctx.fillStyle='#aaa'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(SHORT_DATES[i],x,260-PB+16);
    });

    // score points
    const scores = days.map(d=>calcScore(d.e));
    const pts = scores.map((s,i)=>({x:lineXPositions[i], y:PT+gH-(s/100)*gH, idx:i}));

    // line only (no fill)
    ctx.beginPath();
    ctx.strokeStyle='#7F77DD';
    ctx.lineWidth=2.5;
    pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();

    // dots
    pts.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2);
      ctx.fillStyle='#fff'; ctx.fill();
      ctx.strokeStyle='#7F77DD'; ctx.lineWidth=2.5; ctx.stroke();
    });

    // 垂直輔助線
    const gx = Math.max(PL, Math.min(W-PR, guideX));
    ctx.beginPath();
    ctx.strokeStyle='#1a1a1a';
    ctx.lineWidth=1.5;
    ctx.setLineDash([4,3]);
    ctx.moveTo(gx, PT); ctx.lineTo(gx, PT+gH);
    ctx.stroke();
    ctx.setLineDash([]);

    // 找最近的點
    let nearIdx=0, minD=Infinity;
    lineXPositions.forEach((x,i)=>{const d=Math.abs(x-gx);if(d<minD){minD=d;nearIdx=i;}});
    const nx=lineXPositions[nearIdx];

    // 輔助線上的菱形把手
    ctx.beginPath();
    const hY=PT+gH+8;
    ctx.moveTo(gx,hY-7); ctx.lineTo(gx+6,hY); ctx.lineTo(gx,hY+7); ctx.lineTo(gx-6,hY); ctx.closePath();
    ctx.fillStyle='#1a1a1a'; ctx.fill();

    // 高亮最近節點
    const ny = pts[nearIdx].y;
    ctx.beginPath(); ctx.arc(nx,ny,7,0,Math.PI*2);
    ctx.fillStyle='#7F77DD'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();

    // tooltip
    const label = SHORT_DATES[nearIdx];
    ctx.font='12px sans-serif';
    const tw = ctx.measureText(label).width+16;
    let tx = gx-tw/2;
    if(tx<PL) tx=PL;
    if(tx+tw>W-PR) tx=W-PR-tw;
    const ty = ny-30;
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath();
    ctx.roundRect(tx,ty,tw,22,5);
    ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='left';
    ctx.fillText(label,tx+8,ty+15);

    // 更新下方卡片
    const day=DB[curUser][nearIdx];
    document.getElementById('ddate').textContent=FULL_DATES[nearIdx];
    document.getElementById('dsub').textContent=day.s;
    renderDom(day,document.getElementById('ddom'));
    renderTags(day,document.getElementById('dtags'));
    document.getElementById('dcard').style.display='block';
  }

  redraw();

  // 拖動事件
  const el = canvas;
  function getX(e){ const r=el.getBoundingClientRect(); return (e.touches?e.touches[0].clientX:e.clientX)-r.left; }
  el.onmousedown = el.ontouchstart = e=>{ isDragging=true; guideX=getX(e)*(el.width/el.getBoundingClientRect().width); redraw(); e.preventDefault(); };
  el.onmousemove = el.ontouchmove = e=>{ if(!isDragging)return; guideX=getX(e)*(el.width/el.getBoundingClientRect().width); redraw(); e.preventDefault(); };
  el.onmouseup = el.ontouchend = ()=>{ isDragging=false; };
  el.onmouseleave = ()=>{ isDragging=false; };
}

// ── 主渲染 ──
function render() {
  const day = DB[curUser][curDayIdx];
  document.getElementById('prevBtn').disabled = curDayIdx === 0;
  document.getElementById('nextBtn').disabled = curDayIdx === 6;

  const year = FULL_DATES[curDayIdx].slice(0, 4);
  document.getElementById('year-label').textContent = year + ' 年';

  const parts = FULL_DATES[curDayIdx].split('-');
  const mo = parts[1].replace(/^0/, '') + '月';
  const da = parts[2].replace(/^0/, '') + '日';
  const todayStr = new Date().toISOString().slice(0, 10);
  const isToday = FULL_DATES[curDayIdx] === todayStr;
  const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const dow = new Date(FULL_DATES[curDayIdx]).getDay();
  const suffix = isToday ? '今天' : weekDays[dow];
  document.getElementById('p1date').textContent = mo + da + '　' + suffix;

  if (curPage === 1) {
    document.getElementById('p1sub').textContent = day.s;
    renderDom(day, document.getElementById('p1dom'));
    renderTags(day, document.getElementById('p1tags'));
    setTimeout(() => drawBar(day), 10);
  } else {
    guideX = -1;
    document.getElementById('dcard').style.display='none';
    setTimeout(() => drawLine(), 10);
  }
}

render();
window.addEventListener('resize', () => {
  if (curPage===1) drawBar(DB[curUser][curDayIdx]);
  else drawLine();
});
